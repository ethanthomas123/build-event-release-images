[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build-event-release-images"
version = "0.1.0"
description = "Generate and archive release images from web application build events."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/devtool_images"]

